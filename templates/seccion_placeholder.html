<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seccion {{ numero }}</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1rem;
            background: #f1f5f9;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #0f172a;
        }

        .box {
            width: min(520px, 100%);
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
        }

        a {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            background: #0284c7;
        }
    </style>
</head>
<body>
    <main class="box">
        <h1>Seccion {{ numero }}</h1>
        <p>Este boton aun no esta conectado a una app.</p>
        <a href="{% url 'home' %}">Volver al inicio</a>
    </main>
</body>
</html>
